Configuration:
  name: ICS205
  monitorInterval: 30
  packages: "ics205.util"
  Appenders:
    Console:
      name: Console
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%style{%d{HH:mm:ss.SSS}}{dim} %style{[%t]}{magenta} %highlight{%-5level} %style{%logger{36}}{cyan} - %msg%n"
    RollingFile:
      - name: File
        fileName: "${fileHelper:directory}/log/ics205.log"
        filePattern: "${fileHelper:directory}/log/ics205-%d{yyyy-MM-dd}-%i.log.gz"
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n"
        Policies:
          SizeBasedTriggeringPolicy:
            size: "10MB"
          TimeBasedTriggeringPolicy:
            interval: 1
        DefaultRolloverStrategy:
          max: "10"
      - name: AccessLog
        fileName: "${fileHelper:directory}/log/access.log"
        filePattern: "${fileHelper:directory}/log/access-%d{yyyy-MM-dd}-%i.log.gz"
        PatternLayout:
          pattern: "%msg%n"
        Policies:
          SizeBasedTriggeringPolicy:
            size: "10MB"
          TimeBasedTriggeringPolicy:
            interval: 1
        DefaultRolloverStrategy:
          max: "10"
  Loggers:
    Logger:
      - name: ics205.exporter.RadioExportDefinitions
        level: debug
      - name: ics205.web.HttpAccessLog
        level: info
        additivity: false
        AppenderRef:
          - ref: AccessLog
    Root:
      level: info
      AppenderRef:
        - ref: Console
        - ref: File
