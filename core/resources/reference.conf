auth { 
  userFileName = "users.json"
  sessionFileName = "sessions.json"
  sessionLifetime = 24h
  cookieName = "session"
  # In production deployments served over HTTPS, secureCookie must be set to true
  # (e.g., via JVM argument -Dauth.secureCookie=true or in application configuration)
  # to prevent cookies from being transmitted over plaintext connections.
  secureCookie = false
}
